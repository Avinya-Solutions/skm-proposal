name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Firebase configuration
        id: config
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPLICIT_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase Hosting is not connected yet. Add the FIREBASE_SERVICE_ACCOUNT repository secret and re-run this workflow."
            exit 0
          fi

          PROJECT_ID="$EXPLICIT_PROJECT_ID"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="$(printf '%s' "$SA" | jq -r '.project_id // empty')"
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Could not determine Firebase project_id from FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase Hosting
        if: steps.config.outputs.ready == 'true'
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ steps.config.outputs.project_id }}

      - name: Write deployment summary
        if: steps.config.outputs.ready == 'true'
        env:
          DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
          PROJECT_ID: ${{ steps.config.outputs.project_id }}
        run: |
          LIVE_URL="${DETAILS_URL:-https://${PROJECT_ID}.web.app}"
          echo "### Firebase Hosting Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Live URL: ${LIVE_URL}" >> "$GITHUB_STEP_SUMMARY"
